---
become_override: false
silent: false

# Cluster identity — defaults use the aro_hcp_cluster role naming
aro_hcp_keycloak_cluster_name: "{{ aro_hcp_cluster_name | default('aro' + guid) }}"
aro_hcp_keycloak_cluster_rg: "{{ aro_hcp_cluster_rg | default(aro_hcp_keycloak_cluster_name + '-aro-hcp-rg') }}"

# Keycloak deployment
aro_hcp_keycloak_namespace: keycloak
aro_hcp_keycloak_image: quay.io/keycloak/keycloak:24.0
aro_hcp_keycloak_realm: openshift
aro_hcp_keycloak_console_client_id: openshift-console

# Admin user for Keycloak + OCP console
aro_hcp_keycloak_admin_user: admin
aro_hcp_keycloak_admin_password: REPLACE_ME

# External auth username prefix (NoPrefix has a platform bug — use Prefix)
aro_hcp_keycloak_username_prefix: "keycloak:"

# OCP version for oc CLI download
aro_hcp_keycloak_oc_version: "4.22"

# Kubeconfig paths
aro_hcp_keycloak_kubeconfig_dir: /home/azure/.kube
aro_hcp_keycloak_kubeconfig: /home/azure/.kube/config

# Keycloak deployment resources
aro_hcp_keycloak_cpu_request: 500m
aro_hcp_keycloak_cpu_limit: "1"
aro_hcp_keycloak_mem_request: 512Mi
aro_hcp_keycloak_mem_limit: 1Gi

# Keycloak readiness timeout (seconds)
aro_hcp_keycloak_deploy_timeout: 180
aro_hcp_keycloak_api_retries: 30
aro_hcp_keycloak_api_retry_delay: 5

# Keycloak DB
aro_hcp_keycloak_db_password: "{{ aro_hcp_keycloak_admin_password }}"
