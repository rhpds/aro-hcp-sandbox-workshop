---
become_override: false
silent: false

# Cluster identity — defaults use the aro_hcp_cluster role naming
aro_hcp_keycloak_cluster_name: "{{ aro_hcp_cluster_name | default('aro' + guid) }}"
aro_hcp_keycloak_cluster_rg: "{{ aro_hcp_cluster_rg | default(aro_hcp_keycloak_cluster_name + '-aro-hcp-rg') }}"

# Admin password — must be provided by AgnosticV
aro_hcp_keycloak_admin_password: REPLACE_ME

# OCP version for oc CLI download
aro_hcp_keycloak_oc_version: "4.22"

# Kubeconfig paths
aro_hcp_keycloak_kubeconfig_dir: /home/azure/.kube
aro_hcp_keycloak_kubeconfig: /home/azure/.kube/config

# Keycloak deployment
aro_hcp_keycloak_namespace: keycloak
aro_hcp_keycloak_db_password: "{{ aro_hcp_keycloak_admin_password }}"

# Namespaces where Red Hat registry pull secret is injected
aro_hcp_pull_secret_namespaces:
  - default
  - openshift-config
  - openshift-marketplace
  - openshift-operators
