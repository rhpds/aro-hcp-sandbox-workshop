---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - aro_hcp_keycloak_cluster_name is defined
      - aro_hcp_keycloak_cluster_name | length > 0
      - aro_hcp_keycloak_admin_password is defined
      - aro_hcp_keycloak_admin_password != 'REPLACE_ME'
    fail_msg: >-
      Cluster name and admin password must be set.
      Ensure guid and ADMIN_PASSWORD are provided.

# Step 9: Install oc CLI
- name: Install oc CLI
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sLo /tmp/openshift-client-linux.tar.gz \
      "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-{{ aro_hcp_keycloak_oc_version }}/openshift-client-linux.tar.gz"
    tar xzf /tmp/openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl
    chmod +x /usr/local/bin/oc /usr/local/bin/kubectl
  args:
    executable: /bin/bash
    creates: /usr/local/bin/oc

# Step 10: Break-glass kubeconfig
- name: Ensure .kube directory exists for azure user
  ansible.builtin.file:
    path: "{{ aro_hcp_keycloak_kubeconfig_dir }}"
    state: directory
    mode: "0700"

- name: Ensure .kube directory exists for root
  become: true
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Request break-glass admin kubeconfig
  ansible.builtin.command: >-
    az aro hcp cluster request-credential
    --admin
    --name "{{ aro_hcp_keycloak_cluster_name }}"
    --resource-group "{{ aro_hcp_keycloak_cluster_rg }}"
    --file {{ aro_hcp_keycloak_kubeconfig }}
  changed_when: true

- name: Copy kubeconfig to root
  become: true
  ansible.builtin.copy:
    src: "{{ aro_hcp_keycloak_kubeconfig }}"
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Verify cluster access
  ansible.builtin.command: oc whoami
  environment:
    KUBECONFIG: "{{ aro_hcp_keycloak_kubeconfig }}"
  register: r_whoami
  changed_when: false

- name: Validate break-glass credentials
  ansible.builtin.assert:
    that:
      - r_whoami.rc == 0
      - r_whoami.stdout is search('break-glass')
    fail_msg: "Expected break-glass user, got {{ r_whoami.stdout }}"

# Step 10b: Inject Red Hat registry pull secret
# ARO HCP reconciles the global pull-secret, so we create per-namespace secrets
# and link to ALL service accounts (OLM creates dynamic SAs for operator installs).
- name: Write pull secret to temporary file
  ansible.builtin.copy:
    content: "{{ ocp4_pull_secret }}"
    dest: /tmp/.rh-pull-secret.json
    mode: "0600"
  when: ocp4_pull_secret is defined

- name: Create Red Hat registry pull secret in namespaces
  ansible.builtin.command: >-
    oc create secret generic rh-pull-secret
    --from-file=.dockerconfigjson=/tmp/.rh-pull-secret.json
    --type=kubernetes.io/dockerconfigjson
    -n {{ item }}
  environment:
    KUBECONFIG: "{{ aro_hcp_keycloak_kubeconfig }}"
  loop: "{{ aro_hcp_pull_secret_namespaces }}"
  register: r_create_pull_secret
  changed_when: r_create_pull_secret.rc == 0
  failed_when:
    - r_create_pull_secret.rc != 0
    - "'already exists' not in r_create_pull_secret.stderr"
  when: ocp4_pull_secret is defined

- name: Link pull secret to all service accounts in each namespace
  ansible.builtin.shell: |
    for sa in $(oc get sa -n {{ item }} -o jsonpath='{.items[*].metadata.name}'); do
      oc secrets link "$sa" rh-pull-secret --for=pull -n {{ item }}
    done
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ aro_hcp_keycloak_kubeconfig }}"
  loop: "{{ aro_hcp_pull_secret_namespaces }}"
  changed_when: true
  when: ocp4_pull_secret is defined

- name: Remove temporary pull secret file
  ansible.builtin.file:
    path: /tmp/.rh-pull-secret.json
    state: absent

- name: Pre workload tasks complete
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Cluster access verified as {{ r_whoami.stdout }}"
