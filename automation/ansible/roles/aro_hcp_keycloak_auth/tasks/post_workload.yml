---
- name: Wait for console deployment
  ansible.builtin.command: >-
    oc rollout status deployment/console -n openshift-console --timeout=120s
  environment:
    KUBECONFIG: "{{ aro_hcp_keycloak_kubeconfig }}"
  register: r_console_rollout
  changed_when: false
  retries: 3
  delay: 10
  until: r_console_rollout.rc == 0

- name: Verify console is responding
  ansible.builtin.uri:
    url: "{{ _console_url }}"
    validate_certs: false
    status_code: 200
    follow_redirects: all
  register: r_console_check
  retries: 6
  delay: 10
  until: r_console_check.status == 200

- name: Get cluster API URL
  ansible.builtin.command: >-
    oc whoami --show-server
  environment:
    KUBECONFIG: "{{ aro_hcp_keycloak_kubeconfig }}"
  register: r_api_url
  changed_when: false

- name: Send user info to portal
  aro_hcp_sandbox_workshop.automation.agnosticd_user_info:
    msg: |
      ARO HCP Sandbox Workshop - Environment Ready

      OpenShift Console: {{ _console_url }}
      OpenShift API: {{ r_api_url.stdout }}
      Username: admin
      Password: {{ aro_hcp_keycloak_admin_password }}

      Keycloak Admin Console: {{ _keycloak_url }}
      Keycloak Username: {{ aro_hcp_keycloak_admin_user }}
      Keycloak Password: {{ aro_hcp_keycloak_admin_password }}
    data:
      openshift_console_url: "{{ _console_url }}"
      openshift_api_url: "{{ r_api_url.stdout }}"
      openshift_admin_user: admin
      openshift_admin_password: "{{ aro_hcp_keycloak_admin_password }}"
      keycloak_url: "{{ _keycloak_url }}"
      keycloak_admin_user: "{{ aro_hcp_keycloak_admin_user }}"
      keycloak_admin_password: "{{ aro_hcp_keycloak_admin_password }}"

- name: Post workload tasks complete
  when: not silent | bool
  ansible.builtin.debug:
    msg: >-
      Keycloak IDP configured for {{ aro_hcp_keycloak_cluster_name }}.
      Console: {{ _console_url }}.
      Keycloak: {{ _keycloak_url }}.
      Login: admin / {{ aro_hcp_keycloak_admin_password }}.
