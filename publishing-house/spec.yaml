project:
  slug: "aro-hcp-sandbox-workshop"
  owner_email: "gmidha@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "both"
  description: "A hands-on lab in which attendees learn about ARO HCP's managed control plane model and prove OpenShift Sandboxed Containers' kernel-level pod isolation through live host-escape simulations."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1255"
  workflow_id: "932bfe41-5632-4c57-b7cb-222b7357c153"

spec:
  title: "ARO HCP and OpenShift Sandboxed Containers: Control Plane and Kernel Isolation"
  learning_objectives:
    - "Verify ARO HCP's managed control plane model by inspecting the Azure resource group and confirming the absence of customer-managed master VMs, etcd disks, and control plane load balancers"
    - "Scale a worker NodePool and trace the resulting Azure VM provisioning through the Kubernetes declarative API"
    - "Deploy OpenShift Sandboxed Containers on a Kata-dedicated NodePool, including operator installation and KataConfig configuration"
    - "Troubleshoot Sandboxed Containers admission failures using pod events and oc adm policy who-can"
    - "Prove kernel-level isolation between runc and kata pods through live kernel version comparison and cross-tenant /proc inspection"
    - "Demonstrate host-escape containment by executing sysrq trigger and kernel module load attempts inside a kata workload"
  modules:
    - id: module-00
      title: "Introduction, Pre-flight & Cluster Resource Group"
      duration_min: 20
      status: not_started
    - id: module-01
      title: "Where Is the Control Plane? HyperShift CRDs + NodePool Scaling"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "Kata-Dedicated NodePool & Sandboxed Containers Operator"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Install Kata, Break It, Fix It"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Proving Isolation: Kernel, Process, and Tenant Boundaries"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Build Pipeline — Host Escape Attempt"
      duration_min: 20
      status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "advanced"               # beginner | intermediate | advanced

