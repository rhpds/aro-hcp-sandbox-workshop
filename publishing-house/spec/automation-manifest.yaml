# Automation Manifest — ARO HCP Sandbox Workshop (UC-1: Public Cluster)
# Describes what the lab/demo environment needs pre-configured.
# Source: ARO HCP 2nd Hackathon Guide, Section 4, UC-1 Option A
# Jira: RHDPCD-1255
#
# This manifest is detailed enough for an LLM to generate
# an Ansible role following the agnosticd core_workloads pattern:
#   tasks/main.yml → dispatches to workload.yml / remove_workload.yml
#   defaults/main.yml → all variables with defaults
#   meta/main.yml → role metadata
#
# The role should be written to run FROM the bastion host deployed
# by the AgnosticV catalog item (rh1-2027/lb1083-aro-hcp-sandbox-azure).
# The bastion has az CLI, Java 17, Maven, PostgreSQL client, httpd-tools.
# Azure credentials are injected via azure_sandbox passthrough.

approach: ansible

infrastructure:
  type: azure-sandbox
  description: >
    Azure subscription allocated via RHDP AzureSandbox.
    Bastion RHEL 9.3 VM deployed by AgnosticD env_type open-environment-azure-subscription.
    All az CLI commands run on the bastion using injected service principal credentials.
  bastion: true
  bastion_packages:
    - java-17-openjdk-devel
    - maven
    - postgresql
    - httpd-tools
  multi_user: false
  users_per_deployment: 1

# ─────────────────────────────────────────────────────────────────
# Environment variables expected on the bastion
# These are derived from the Azure sandbox credentials and guid.
# The role must set them from AgnosticD passthrough vars.
# ─────────────────────────────────────────────────────────────────
environment_variables:
  - name: SUBSCRIPTION_ID
    source: azure_sandbox.credentials[0].subscription_id
  - name: LOCATION
    source: azure_region
    default: eastus
  - name: CLUSTER_NAME
    source: guid
    description: "Use the RHDP guid as the cluster name for uniqueness"
  - name: CUSTOMER_RG_NAME
    value: "{{ guid }}-aro-hcp-rg"
  - name: MANAGED_RESOURCE_GROUP
    value: "{{ guid }}-aro-hcp-managed-rg"
  - name: CUSTOMER_VNET_NAME
    value: "{{ guid }}-vnet"
  - name: CUSTOMER_VNET_SUBNET1
    value: "{{ guid }}-worker-subnet"
  - name: CUSTOMER_VNET_INTEGRATION_SUBNET_NAME
    value: "{{ guid }}-vnet-integration-subnet"
  - name: CUSTOMER_NSG
    value: "{{ guid }}-nsg"
  - name: KV_NAME
    value: "{{ guid }}-kv"
    description: "Key Vault name — must be globally unique, max 24 chars"
  - name: CLUSTER_VERSION
    default: "4.22.0"
    description: "ARO HCP cluster version"
  - name: NP_NAME
    value: "{{ guid }}-np"
    description: "Node pool name"
  - name: NP_VERSION
    default: "4.22.0"
    description: "Node pool version — must match or be compatible with cluster version"

# ─────────────────────────────────────────────────────────────────
# UC-1 Option A: Public Cluster Provisioning Steps
# Each step maps to a task or block in the Ansible role.
# Steps must be idempotent — use `az ... create` with checks.
# ─────────────────────────────────────────────────────────────────
steps:
  - name: step_1_login_service_principal
    description: >
      Authenticate to Azure using the sandbox service principal.
      Use az login --service-principal with app_id, password, tenant
      from the injected azure_sandbox credentials.
    az_commands:
      - >
        az login --service-principal
        -u "{{ azure_service_principal_id }}"
        -p "{{ azure_service_principal_password }}"
        --tenant "{{ azure_tenant }}"
    idempotent: true

  - name: step_2_create_resource_group
    description: "Create the customer resource group for all ARO HCP resources."
    az_commands:
      - >
        az group create
        --name "${CUSTOMER_RG_NAME}"
        --subscription "${SUBSCRIPTION_ID}"
        --location "${LOCATION}"
    idempotent: true

  - name: step_3_create_network_infrastructure
    description: >
      Create NSG, VNet, worker subnet (with NSG attached and
      private-endpoint-network-policies Disabled), and VNet
      integration subnet (with delegation to
      Microsoft.RedHatOpenShift/hcpOpenShiftClusters).
    az_commands:
      - >
        az network nsg create
        --name "${CUSTOMER_NSG}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --location "${LOCATION}"
      - >
        az network vnet create
        --name "${CUSTOMER_VNET_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --location "${LOCATION}"
        --address-prefixes 10.0.0.0/16
      - >
        az network vnet subnet create
        --name "${CUSTOMER_VNET_SUBNET1}"
        --vnet-name "${CUSTOMER_VNET_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --address-prefixes 10.0.0.0/24
        --network-security-group "${CUSTOMER_NSG}"
        --private-endpoint-network-policies Disabled
      - >
        az network vnet subnet create
        --name "${CUSTOMER_VNET_INTEGRATION_SUBNET_NAME}"
        --vnet-name "${CUSTOMER_VNET_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --address-prefixes 10.0.1.0/24
        --delegations Microsoft.RedHatOpenShift/hcpOpenShiftClusters
    outputs:
      - NSG_ID: "az network nsg show --name ${CUSTOMER_NSG} --resource-group ${CUSTOMER_RG_NAME} --query id -o tsv"
      - SUBNET_ID: "az network vnet subnet show --name ${CUSTOMER_VNET_SUBNET1} --vnet-name ${CUSTOMER_VNET_NAME} --resource-group ${CUSTOMER_RG_NAME} --query id -o tsv"
      - VNET_ID: "az network vnet show --name ${CUSTOMER_VNET_NAME} --resource-group ${CUSTOMER_RG_NAME} --query id -o tsv"
      - VNET_INTEGRATION_SUBNET_ID: "az network vnet subnet show --name ${CUSTOMER_VNET_INTEGRATION_SUBNET_NAME} --vnet-name ${CUSTOMER_VNET_NAME} --resource-group ${CUSTOMER_RG_NAME} --query id -o tsv"
    idempotent: true

  - name: step_4_create_key_vault_public
    description: >
      Create a PUBLIC Key Vault with RBAC authorization enabled.
      Assign the Key Vault Crypto Officer role to the service principal
      so it can create the etcd encryption key.
      Then create the RSA-2048 etcd encryption key and capture its version.
    az_commands:
      - >
        az keyvault create
        --resource-group "${CUSTOMER_RG_NAME}"
        --name "${KV_NAME}"
        --enable-rbac-authorization true
        --public-network-access Enabled
        --location "${LOCATION}"
      - >
        az role assignment create
        --assignee-object-id "${SP_OBJECT_ID}"
        --assignee-principal-type ServicePrincipal
        --role "14b46e9e-c2b7-41b4-b07b-48a6ebf60603"
        --scope "${KV_ID}"
      - >
        az keyvault key create
        --vault-name "${KV_NAME}"
        --name "etcd-data-kms-encryption-key"
        --kty RSA
        --size 2048
    outputs:
      - KV_ID: "az keyvault show --name ${KV_NAME} --resource-group ${CUSTOMER_RG_NAME} --query id -o tsv"
      - SP_OBJECT_ID: "az ad sp show --id ${azure_service_principal_id} --query id -o tsv"
      - ETCD_KEY_VERSION: "az keyvault key show --vault-name ${KV_NAME} --name etcd-data-kms-encryption-key --query 'key.kid' -o tsv | rev | cut -d'/' -f1 | rev"
    notes: >
      The role assignment uses the Key Vault Crypto Officer role GUID
      (14b46e9e-c2b7-41b4-b07b-48a6ebf60603). Unlike Bicep, the CLI
      az keyvault key create is a direct data plane call that requires
      an explicit Key Vault data plane role.
    idempotent: true

  - name: step_5_create_managed_identities
    description: >
      Create 13 user-assigned managed identities for cluster operators.
      9 control-plane, 3 data-plane, 1 service managed identity.
      Capture all resource IDs and principal IDs for role assignments.
    managed_identities:
      control_plane:
        - "{CLUSTER_NAME}-cp-cluster-api-azure"
        - "{CLUSTER_NAME}-cp-control-plane"
        - "{CLUSTER_NAME}-cp-cloud-controller-manager"
        - "{CLUSTER_NAME}-cp-ingress"
        - "{CLUSTER_NAME}-cp-disk-csi-driver"
        - "{CLUSTER_NAME}-cp-file-csi-driver"
        - "{CLUSTER_NAME}-cp-image-registry"
        - "{CLUSTER_NAME}-cp-cloud-network-config"
        - "{CLUSTER_NAME}-cp-kms"
      data_plane:
        - "{CLUSTER_NAME}-dp-disk-csi-driver"
        - "{CLUSTER_NAME}-dp-file-csi-driver"
        - "{CLUSTER_NAME}-dp-image-registry"
      service:
        - "{CLUSTER_NAME}-service-managed-identity"
    az_command_pattern: >
      az identity create --name "{identity_name}"
      --resource-group "${CUSTOMER_RG_NAME}"
    outputs_pattern: >
      For each identity, capture:
        MI_ID: az identity show --name "{name}" --resource-group "${CUSTOMER_RG_NAME}" --query id -o tsv
        MI_PID: az identity show --name "{name}" --resource-group "${CUSTOMER_RG_NAME}" --query principalId -o tsv
    idempotent: true

  - name: step_6_create_role_assignments
    description: >
      Assign Azure RBAC roles to each managed identity.
      Uses fixed role definition GUIDs (not names) for determinism.
    role_definitions:
      READER_ROLE: "acdd72a7-3385-48ef-bd42-f606fba81ae7"
      HCP_CLUSTER_API_PROVIDER_ROLE: "88366f10-ed47-4cc0-9fab-c8a06148393e"
      HCP_CONTROL_PLANE_OPERATOR_ROLE: "fc0c873f-45e9-4d0d-a7d1-585aab30c6ed"
      CLOUD_CONTROLLER_MANAGER_ROLE: "a1f96423-95ce-4224-ab27-4e3dc72facd4"
      INGRESS_OPERATOR_ROLE: "0336e1d3-7a87-462b-b6db-342b63f7802c"
      FILE_STORAGE_OPERATOR_ROLE: "0d7aedc0-15fd-4a67-a412-efad370c947e"
      IMAGE_REGISTRY_ROLE: "8b32b316-c2f5-4ddf-b05b-83dacd2d08b5"
      NETWORK_OPERATOR_ROLE: "be7a6435-15ae-4171-8f30-4a343eff9e8f"
      FEDERATED_CREDENTIAL_ROLE: "ef318e2a-8334-4a05-9e4a-295a196c6a6e"
      HCP_SERVICE_MI_ROLE: "c0ff367d-66d8-445e-917c-583feb0ef0d4"
      KEY_VAULT_CRYPTO_USER_ROLE: "12338af0-0e69-4776-bea7-57ae8d297424"
    assignments:
      # Control plane operators
      - identity: cp-cluster-api-azure
        role: HCP_CLUSTER_API_PROVIDER_ROLE
        scopes: [VNET_ID]
      - identity: cp-control-plane
        role: HCP_CONTROL_PLANE_OPERATOR_ROLE
        scopes: [VNET_ID, NSG_ID]
      - identity: cp-cloud-controller-manager
        role: CLOUD_CONTROLLER_MANAGER_ROLE
        scopes: [VNET_ID, NSG_ID]
      - identity: cp-ingress
        role: INGRESS_OPERATOR_ROLE
        scopes: [VNET_ID]
      - identity: cp-file-csi-driver
        role: FILE_STORAGE_OPERATOR_ROLE
        scopes: [VNET_ID, NSG_ID]
      - identity: cp-image-registry
        role: IMAGE_REGISTRY_ROLE
        scopes: [VNET_ID]
      - identity: cp-cloud-network-config
        role: NETWORK_OPERATOR_ROLE
        scopes: [SUBNET_ID, VNET_ID]
      - identity: cp-kms
        role: KEY_VAULT_CRYPTO_USER_ROLE
        scopes: [KV_ID]
      # Service managed identity
      - identity: service-managed-identity
        role: HCP_SERVICE_MI_ROLE
        scopes: [VNET_ID, NSG_ID]
      - identity: service-managed-identity
        role: READER_ROLE
        scopes:
          - all control plane identity resource IDs
      # Data plane operators
      - identity: service-managed-identity
        role: FEDERATED_CREDENTIAL_ROLE
        scopes:
          - dp-disk-csi-driver MI_ID
          - dp-file-csi-driver MI_ID
          - dp-image-registry MI_ID
      - identity: dp-file-csi-driver
        role: FILE_STORAGE_OPERATOR_ROLE
        scopes: [SUBNET_ID, NSG_ID]
    idempotent: true
    notes: >
      Use --assignee-principal-type ServicePrincipal for all assignments.
      Role assignments are idempotent — az role assignment create
      returns success if the assignment already exists.

  - name: step_7_create_cluster_public
    description: >
      Create the ARO HCP cluster (Option A — Public).
      API and ingress are public by default (no --api-visibility or
      --ingress-visibility flags needed).
      Requires building USER_ASSIGNED_IDS and OPERATOR_AUTH strings
      from the managed identity resource IDs collected in step 5.
    az_commands:
      - >
        az aro hcp cluster create
        --name "${CLUSTER_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --location "${LOCATION}"
        --version "${CLUSTER_VERSION}"
        --channel-group stable
        --subnet-id "${SUBNET_ID}"
        --vnet-integration-subnet-id "${VNET_INTEGRATION_SUBNET_ID}"
        --nsg "${NSG_ID}"
        --managed-resource-group-name "${MANAGED_RESOURCE_GROUP}"
        --key-management-mode CustomerManaged
        --etcd-encryption-type KMS
        --kms-vault-name "${KV_NAME}"
        --vault-visibility "Public"
        --kms-active-key "{name:etcd-data-kms-encryption-key,version:${ETCD_KEY_VERSION}}"
        --user-assigned-identities "${USER_ASSIGNED_IDS}"
        --operators-authentication "${OPERATOR_AUTH}"
    user_assigned_ids_format: >
      {MI_ID_1:{},MI_ID_2:{},...} — all 10 identity resource IDs
      (service + 9 control plane) as JSON-like map with empty objects
    operator_auth_format: >
      {user-assigned-identities:{
        control-plane-operators:{
          cluster-api-azure:MI_ID,
          control-plane:MI_ID,
          cloud-controller-manager:MI_ID,
          ingress:MI_ID,
          disk-csi-driver:MI_ID,
          file-csi-driver:MI_ID,
          image-registry:MI_ID,
          cloud-network-config:MI_ID,
          kms:MI_ID
        },
        data-plane-operators:{
          disk-csi-driver:MI_ID,
          file-csi-driver:MI_ID,
          image-registry:MI_ID
        },
        service-managed-identity:MI_ID
      }}
    estimated_duration: "20 minutes"
    notes: >
      This is a long-running operation (~20 min). The Ansible task
      should use async/poll or a retry loop checking provisioningState.
    idempotent: false

  - name: step_8_verify_cluster
    description: >
      Verify the cluster reached provisioningState: Succeeded.
      Poll until Succeeded or timeout after 30 minutes.
    az_commands:
      - >
        az aro hcp cluster show
        --name "${CLUSTER_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --query "{provisioningState:properties.provisioningState, version:properties.version.id}"
        --output json
    expected_result:
      provisioningState: Succeeded
      version: "4.22.x"
    validation:
      retry_count: 30
      retry_delay_seconds: 60
      success_condition: "provisioningState == 'Succeeded'"
    idempotent: true

  - name: step_9_create_nodepool
    description: >
      Create a node pool with 2 Standard_D4s_v6 worker nodes.
      This adds compute capacity to the cluster.
    az_commands:
      - >
        az aro hcp cluster nodepool create
        --cluster-name "${CLUSTER_NAME}"
        --name "${NP_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --replicas 2
        --vm-size Standard_D4s_v6
        --version "${NP_VERSION}"
        --channel-group stable
    estimated_duration: "5-10 minutes"
    idempotent: false

  - name: step_10_verify_nodepool
    description: >
      Verify the node pool reached provisioningState: Succeeded.
    az_commands:
      - >
        az aro hcp cluster nodepool show
        --cluster-name "${CLUSTER_NAME}"
        --name "${NP_NAME}"
        --resource-group "${CUSTOMER_RG_NAME}"
        --query provisioningState
        --output tsv
    expected_result: Succeeded
    validation:
      retry_count: 15
      retry_delay_seconds: 60
      success_condition: "provisioningState == 'Succeeded'"
    idempotent: true

# ─────────────────────────────────────────────────────────────────
# Teardown (UC-8 from the doc)
# CRITICAL: Delete cluster first, THEN resource group.
# There is a known bug where deleting the resource group first
# causes it to get stuck.
# ─────────────────────────────────────────────────────────────────
teardown:
  order:
    - "Delete nodepool: az aro hcp cluster nodepool delete --cluster-name ${CLUSTER_NAME} --name ${NP_NAME} --resource-group ${CUSTOMER_RG_NAME} --yes"
    - "Delete cluster: az aro hcp cluster delete --name ${CLUSTER_NAME} --resource-group ${CUSTOMER_RG_NAME} --yes"
    - "Wait for cluster deletion to complete before proceeding"
    - "Delete resource group: az group delete --name ${CUSTOMER_RG_NAME} --yes --no-wait"
  notes: >
    NEVER delete the resource group to tear down the cluster.
    Always delete cluster first, then resource group.
    Known bug causes stuck resource group if order is reversed.

# ─────────────────────────────────────────────────────────────────
# Provision data — what gets passed back to showroom/user
# ─────────────────────────────────────────────────────────────────
provision_data:
  - name: aro_hcp_cluster_name
    description: "ARO HCP cluster name"
  - name: aro_hcp_api_url
    description: "ARO HCP API server URL (from cluster show)"
  - name: aro_hcp_console_url
    description: "ARO HCP console URL"
  - name: azure_resource_group
    description: "Customer resource group name"
  - name: azure_key_vault_name
    description: "Key Vault name"

notes: >
  This manifest covers UC-1 Option A (public cluster) only.
  UC-1 Option B (private cluster) adds --api-visibility Private
  and --ingress-visibility Private flags, plus optional private
  Key Vault with private endpoint and DNS zone — this can be added
  as a variant later.
  The automation role repo is https://github.com/rhpds/aro-hcp-sandbox-workshop
  in the automation/ directory.
