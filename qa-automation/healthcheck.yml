---
# HEALTHCHECK — Quick environment readiness check
# Runs post-provisioning to verify the lab environment is functional.
# Should complete in under 60 seconds.
#
# Exit 0 = healthy, non-zero = unhealthy.
#
# What this verifies (the lab's critical pieces):
#   1. OpenShift / ARO HCP API server is reachable and all nodes are Ready
#   2. ARO HCP hosted control plane reports provisioningState: Succeeded
#   3. The Sandboxed Containers (Kata) runtime is installed and usable
#   4. The Showroom pod that serves the lab content is Running
#
# Usage (from the bastion, where oc and az are already authenticated):
#   ansible-playbook qa-automation/healthcheck.yml
#   ansible-playbook qa-automation/healthcheck.yml -e qa_showroom_namespace=showroom-abcde

- name: "Environment Health Check"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Kubeconfig produced by the provisioning playbooks (see keycloak role default).
    qa_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('/home/azure/.kube/config', true) }}"

    # Cluster identity — mirrors the aro_hcp_cluster role naming so this can be
    # invoked with the same -e vars used by the automation, or stand alone.
    qa_cluster_name: "{{ aro_hcp_cluster_name | default('aro' + (guid | default(''))) }}"
    qa_cluster_rg: "{{ aro_hcp_cluster_rg | default(qa_cluster_name + '-aro-hcp-rg') }}"

    # Kata / confidential-containers runtime expectations.
    qa_kata_runtimeclass: kata
    qa_kata_node_label: "node-role.kubernetes.io/kata"

    # Showroom pod discovery. Leave namespace empty to search cluster-wide by label.
    qa_showroom_namespace: ""
    qa_showroom_label: "app.kubernetes.io/name=showroom"

    # Treat the Azure-side HCP check as advisory when az is not logged in on this
    # host. Set to true to make a failed/absent az session fail the healthcheck.
    qa_require_azure: false

  environment:
    KUBECONFIG: "{{ qa_kubeconfig }}"

  tasks:
    # ---------------------------------------------------------------
    # 1. OpenShift / ARO HCP API server reachability + node readiness
    # ---------------------------------------------------------------
    - name: "API | Query the kube-apiserver readiness endpoint"
      ansible.builtin.command: oc get --raw=/readyz
      register: r_api_readyz
      changed_when: false
      failed_when: false

    - name: "API | Assert the API server is reachable and ready"
      ansible.builtin.assert:
        that:
          - r_api_readyz.rc == 0
          - "'ok' in r_api_readyz.stdout"
        fail_msg: >-
          OpenShift API server did not return 'ok' from /readyz
          (rc={{ r_api_readyz.rc }}): {{ r_api_readyz.stderr | default('') }}
        success_msg: "OpenShift / ARO HCP API server is reachable and ready."

    - name: "API | List nodes and their Ready condition"
      ansible.builtin.command: >-
        oc get nodes
        -o jsonpath={range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}
      register: r_nodes
      changed_when: false
      failed_when: false

    - name: "API | Assert every node is Ready"
      ansible.builtin.assert:
        that:
          - r_nodes.rc == 0
          - r_nodes.stdout_lines | length > 0
          - r_nodes.stdout_lines | select('search', '=False') | list | length == 0
          - r_nodes.stdout_lines | select('search', '=Unknown') | list | length == 0
        fail_msg: "One or more nodes are not Ready:\n{{ r_nodes.stdout }}"
        success_msg: "All {{ r_nodes.stdout_lines | length }} node(s) report Ready."

    # ---------------------------------------------------------------
    # 2. ARO HCP hosted control plane (Azure-side) provisioning state
    # ---------------------------------------------------------------
    - name: "HCP | Query ARO HCP cluster provisioningState"
      ansible.builtin.command: >-
        az aro hcp cluster show
        --name {{ qa_cluster_name }}
        --resource-group {{ qa_cluster_rg }}
        --query properties.provisioningState
        --output tsv
      register: r_hcp_state
      changed_when: false
      failed_when: false

    - name: "HCP | Assert the hosted control plane reports Succeeded"
      ansible.builtin.assert:
        that:
          - r_hcp_state.rc == 0
          - r_hcp_state.stdout | trim == "Succeeded"
        fail_msg: >-
          ARO HCP cluster '{{ qa_cluster_name }}' in RG '{{ qa_cluster_rg }}'
          is not in Succeeded state (rc={{ r_hcp_state.rc }}):
          {{ r_hcp_state.stdout | default('') }} {{ r_hcp_state.stderr | default('') }}
        success_msg: "ARO HCP hosted control plane provisioningState: Succeeded."
      when: qa_require_azure | bool

    - name: "HCP | Advisory: hosted control plane state (az session optional)"
      ansible.builtin.debug:
        msg: >-
          {% if r_hcp_state.rc == 0 %}ARO HCP provisioningState: {{ r_hcp_state.stdout | trim }}.
          {% else %}Skipped Azure-side HCP check — az not authenticated on this host
          (set -e qa_require_azure=true to enforce). The API /readyz check above already
          confirms the hosted control plane is serving requests.{% endif %}
      when: not (qa_require_azure | bool)

    # ---------------------------------------------------------------
    # 3. Sandboxed Containers (Kata) runtime
    # ---------------------------------------------------------------
    - name: "Kata | Check the kata RuntimeClass exists"
      ansible.builtin.command: "oc get runtimeclass {{ qa_kata_runtimeclass }} -o name"
      register: r_runtimeclass
      changed_when: false
      failed_when: false

    - name: "Kata | Check at least one Kata-labelled node is present"
      ansible.builtin.command: >-
        oc get nodes -l {{ qa_kata_node_label }}= -o jsonpath={.items[*].metadata.name}
      register: r_kata_nodes
      changed_when: false
      failed_when: false

    - name: "Kata | Check KataConfig install completion"
      ansible.builtin.command: >-
        oc get kataconfig -o jsonpath={.items[0].status.kataNodes.readyNodeCount}
      register: r_kataconfig
      changed_when: false
      failed_when: false

    - name: "Kata | Assert the Kata runtime is installed and ready"
      ansible.builtin.assert:
        that:
          - r_runtimeclass.rc == 0
          - "'runtimeclass.node.k8s.io/' + qa_kata_runtimeclass in r_runtimeclass.stdout"
          - r_kata_nodes.stdout | trim | length > 0
          - r_kataconfig.rc == 0
          - (r_kataconfig.stdout | trim | default('0')) | int > 0
        fail_msg: >-
          Kata runtime is not ready — runtimeclass rc={{ r_runtimeclass.rc }},
          kata nodes='{{ r_kata_nodes.stdout | trim }}',
          KataConfig readyNodeCount='{{ r_kataconfig.stdout | trim }}'.
        success_msg: >-
          Kata runtime ready: RuntimeClass '{{ qa_kata_runtimeclass }}' present,
          {{ (r_kataconfig.stdout | trim | default('0')) | int }} node(s) installed.

    # ---------------------------------------------------------------
    # 4. Showroom pod (serves the lab guide)
    # ---------------------------------------------------------------
    - name: "Showroom | Find Showroom pod phase(s) by label"
      ansible.builtin.command: >-
        oc get pods
        {% if qa_showroom_namespace | length > 0 %}-n {{ qa_showroom_namespace }}{% else %}-A{% endif %}
        -l {{ qa_showroom_label }}
        -o jsonpath={range .items[*]}{.status.phase}{"\n"}{end}
      register: r_showroom
      changed_when: false
      failed_when: false

    - name: "Showroom | Assert a Showroom pod is Running"
      ansible.builtin.assert:
        that:
          - r_showroom.rc == 0
          - r_showroom.stdout_lines | length > 0
          - r_showroom.stdout_lines | select('equalto', 'Running') | list | length > 0
        fail_msg: >-
          No Running Showroom pod found for label '{{ qa_showroom_label }}'
          {% if qa_showroom_namespace | length > 0 %}in namespace
          '{{ qa_showroom_namespace }}'{% else %}cluster-wide{% endif %}.
          Phases seen: {{ r_showroom.stdout_lines | default([]) }}.
          If Showroom is served outside this cluster, pass the correct namespace
          via -e qa_showroom_namespace=... or adjust qa_showroom_label.
        success_msg: "Showroom pod is Running."

    # ---------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------
    - name: "Health check passed"
      ansible.builtin.debug:
        msg: "Environment is healthy — API, hosted control plane, Kata runtime, and Showroom all OK."
